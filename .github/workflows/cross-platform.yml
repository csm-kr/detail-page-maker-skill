name: Cross-platform skill validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 22 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate single-skill bundle
        run: node tests/run-suite.mjs portable-skill

      - name: Validate orchestration
        run: node tests/run-suite.mjs orchestration

      - name: Validate Studio runtime
        run: node tests/run-suite.mjs studio-v1
