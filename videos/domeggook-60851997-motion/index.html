<!doctype html>
<html lang="ko" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=800" />
    <title>60851997 실제품 깔창 모션 스튜디오</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 800px; height: 800px; margin: 0; overflow: hidden; background: #07111f; }
      #root { position: relative; width: 800px; height: 800px; overflow: hidden; }
      .clip { position: absolute; inset: 0; width: 800px; height: 800px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="actual-insole-motion-studio" data-start="0" data-duration="38.4" data-width="800" data-height="800" data-fps="15">
      <section id="clip-top-bottom" class="clip" data-composition-id="actual-top-bottom" data-composition-src="compositions/top-bottom.html" data-start="0" data-duration="4.8" data-track-index="1"></section>
      <section id="clip-cell-scan" class="clip" data-composition-id="actual-cell-scan" data-composition-src="compositions/cell-scan.html" data-start="4.8" data-duration="4.8" data-track-index="1"></section>
      <section id="clip-perforation-path" class="clip" data-composition-id="actual-perforation-path" data-composition-src="compositions/perforation-path.html" data-start="9.6" data-duration="4.8" data-track-index="1"></section>
      <section id="clip-flex-sequence" class="clip" data-composition-id="actual-flex-sequence" data-composition-src="compositions/flex-sequence.html" data-start="14.4" data-duration="4.8" data-track-index="1"></section>
      <section id="clip-size-selector" class="clip" data-composition-id="actual-size-selector" data-composition-src="compositions/size-selector.html" data-start="19.2" data-duration="4.8" data-track-index="1"></section>
      <section id="clip-shoe-insertion" class="clip" data-composition-id="actual-shoe-insertion" data-composition-src="compositions/shoe-insertion.html" data-start="24" data-duration="4.8" data-track-index="1"></section>
      <section id="clip-one-pair" class="clip" data-composition-id="actual-one-pair" data-composition-src="compositions/one-pair.html" data-start="28.8" data-duration="4.8" data-track-index="1"></section>
      <section id="clip-material-cross-section" class="clip" data-composition-id="actual-material-cross-section" data-composition-src="compositions/material-cross-section.html" data-start="33.6" data-duration="4.8" data-track-index="1"></section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["actual-insole-motion-studio"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
