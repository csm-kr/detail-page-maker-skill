<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=720" />
    <title>양면 커터 기능 모션</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        src: local("Noto Sans KR");
        font-style: normal;
        font-weight: 100 900;
      }

      :root {
        --background: #0b2922;
        --background-deep: #071f1a;
        --surface: #173e34;
        --accent: #dfff5a;
        --text: #f4f1e8;
        --steel: #c7cec9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 800px;
        height: 720px;
        margin: 0;
        overflow: hidden;
        background: var(--background);
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
      }

      #stage {
        position: relative;
        width: 800px;
        height: 720px;
        overflow: hidden;
        color: var(--text);
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .scene-fill {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(23, 62, 52, 0.96) 0, rgba(11, 41, 34, 0) 58%),
          linear-gradient(135deg, var(--background) 0%, var(--background-deep) 100%);
      }

      .scene-fill::before {
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(223, 255, 90, 0.12);
        border-radius: 28px;
        content: "";
      }

      .scene-fill::after {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(223, 255, 90, 0.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(223, 255, 90, 0.026) 1px, transparent 1px);
        background-size: 40px 40px;
        content: "";
        opacity: 0.42;
      }

      .product-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        pointer-events: none;
      }

      #dual-blade-product {
        position: absolute;
        top: 10px;
        left: 50px;
        display: block;
        width: 700px;
        height: 700px;
        object-fit: contain;
        filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.32));
      }

      .annotation {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .label {
        position: absolute;
        display: flex;
        width: 280px;
        height: 144px;
        align-items: flex-end;
      }

      .label--front {
        top: 192px;
        left: 460px;
        width: 308px;
        justify-content: flex-end;
        text-align: right;
      }

      .label--reverse {
        top: 388px;
        left: 32px;
        width: 260px;
        justify-content: flex-start;
        text-align: left;
        opacity: 0;
        visibility: hidden;
      }

      .label__pill {
        display: inline-flex;
        min-height: 58px;
        align-items: center;
        padding: 0 22px;
        border: 1px solid rgba(223, 255, 90, 0.42);
        border-radius: 999px;
        background: rgba(23, 62, 52, 0.94);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
        color: var(--text);
        font-size: 25px;
        font-weight: 750;
        letter-spacing: -0.035em;
        line-height: 1;
        white-space: nowrap;
      }

      .label__pill::before {
        display: block;
        width: 8px;
        height: 8px;
        margin-right: 11px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(223, 255, 90, 0.8);
        content: "";
      }

      .connector {
        position: absolute;
        inset: 0;
        width: 800px;
        height: 720px;
        overflow: visible;
      }

      .connector path {
        fill: none;
        stroke: var(--accent);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.5;
        vector-effect: non-scaling-stroke;
      }

      .connector circle {
        fill: var(--accent);
        filter: drop-shadow(0 0 6px rgba(223, 255, 90, 0.8));
      }

      #reverse-connector,
      #reverse-connector-dot {
        opacity: 0;
        visibility: hidden;
      }

      #front-connector,
      #reverse-connector {
        stroke-dasharray: 1;
      }

      #reverse-connector {
        stroke-dashoffset: 1;
      }

      .feature-box {
        position: absolute;
        overflow: hidden;
      }

      .feature-box--front {
        top: 430px;
        left: 478px;
        width: 220px;
        height: 112px;
      }

      .feature-box--reverse {
        top: 505px;
        left: 428px;
        width: 252px;
        height: 112px;
        opacity: 0;
        visibility: hidden;
      }

      .feature-glow {
        position: absolute;
        inset: 4px;
        border-radius: 26px;
        background: radial-gradient(
          ellipse at center,
          rgba(223, 255, 90, 0.28) 0%,
          rgba(223, 255, 90, 0.07) 52%,
          rgba(223, 255, 90, 0) 78%
        );
        opacity: 0.18;
      }

      .scanline {
        position: absolute;
        top: -30px;
        left: -54px;
        display: block;
        width: 42px;
        height: 270px;
        background: linear-gradient(
          90deg,
          rgba(223, 255, 90, 0),
          rgba(223, 255, 90, 0.72),
          rgba(223, 255, 90, 0)
        );
        filter: blur(3px);
        opacity: 0;
        transform: rotate(12deg);
      }

      .reticle {
        position: absolute;
        height: 112px;
      }

      .reticle--front {
        top: 430px;
        left: 478px;
        width: 220px;
      }

      .reticle--reverse {
        top: 505px;
        left: 428px;
        width: 252px;
        opacity: 0;
        visibility: hidden;
      }

      .reticle__corner {
        position: absolute;
        width: 26px;
        height: 26px;
        border-color: var(--accent);
        border-style: solid;
        filter: drop-shadow(0 0 5px rgba(223, 255, 90, 0.34));
      }

      .reticle__corner--tl {
        top: 0;
        left: 0;
        border-width: 2px 0 0 2px;
        border-radius: 8px 0 0;
      }

      .reticle__corner--tr {
        top: 0;
        right: 0;
        border-width: 2px 2px 0 0;
        border-radius: 0 8px 0 0;
      }

      .reticle__corner--bl {
        bottom: 0;
        left: 0;
        border-width: 0 0 2px 2px;
        border-radius: 0 0 0 8px;
      }

      .reticle__corner--br {
        right: 0;
        bottom: 0;
        border-width: 0 2px 2px 0;
        border-radius: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="dual-blade-motion"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="800"
      data-height="720"
    >
      <section
        id="dual-blade-clip"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      >
        <div class="scene-fill" aria-hidden="true"></div>

        <div class="product-stage">
          <img
            id="dual-blade-product"
            src="assets/product-cutout.png"
            alt="양면 커터가 있는 다용도 미니 채칼"
          />
        </div>

        <div id="front-annotation" class="annotation">
          <div id="front-label" class="label label--front">
            <span class="label__pill">껍질 제거 · 얇게 썰기</span>
          </div>

          <svg class="connector" viewBox="0 0 800 720" aria-hidden="true" data-layout-ignore>
            <path id="front-connector" pathLength="1" d="M 510 308 L 548 308 L 590 486" />
            <circle id="front-connector-dot" cx="590" cy="486" r="5" />
          </svg>

          <div class="feature-box feature-box--front" aria-hidden="true">
            <div id="front-glow" class="feature-glow"></div>
            <span id="front-scanline" class="scanline"></span>
          </div>

          <div id="front-reticle" class="reticle reticle--front" aria-hidden="true">
            <span class="reticle__corner reticle__corner--tl"></span>
            <span class="reticle__corner reticle__corner--tr"></span>
            <span class="reticle__corner reticle__corner--bl"></span>
            <span class="reticle__corner reticle__corner--br"></span>
          </div>
        </div>

        <div id="reverse-annotation" class="annotation">
          <div id="reverse-label" class="label label--reverse">
            <span class="label__pill">채썰기 커터</span>
          </div>

          <svg class="connector" viewBox="0 0 800 720" aria-hidden="true" data-layout-ignore>
            <path id="reverse-connector" pathLength="1" d="M 260 492 L 354 492 L 528 566" />
            <circle id="reverse-connector-dot" cx="528" cy="566" r="5" />
          </svg>

          <div id="reverse-feature" class="feature-box feature-box--reverse" aria-hidden="true">
            <div id="reverse-glow" class="feature-glow"></div>
            <span id="reverse-scanline" class="scanline"></span>
          </div>

          <div id="reverse-reticle" class="reticle reticle--reverse" aria-hidden="true">
            <span class="reticle__corner reticle__corner--tl"></span>
            <span class="reticle__corner reticle__corner--tr"></span>
            <span class="reticle__corner reticle__corner--bl"></span>
            <span class="reticle__corner reticle__corner--br"></span>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#front-scanline",
        { x: 0, autoAlpha: 0 },
        { x: 228, autoAlpha: 0.55, duration: 0.22, ease: "power2.out" },
        0.08,
      );
      tl.to(
        "#front-scanline",
        { x: 272, autoAlpha: 0, duration: 0.22, ease: "power2.in" },
        0.3,
      );
      tl.fromTo(
        "#front-glow",
        { autoAlpha: 0.18 },
        {
          autoAlpha: 0.48,
          duration: 0.22,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        0.08,
      );

      tl.to(
        ["#front-label", "#front-connector", "#front-connector-dot", "#front-reticle"],
        { autoAlpha: 0, duration: 0.16, ease: "power2.in" },
        1.18,
      );
      tl.to("#front-glow", { autoAlpha: 0, duration: 0.16, ease: "power2.in" }, 1.18);

      tl.fromTo(
        "#reverse-label",
        { x: 18, autoAlpha: 0 },
        { x: 0, autoAlpha: 1, duration: 0.16, ease: "power2.out" },
        1.4,
      );
      tl.fromTo(
        "#reverse-connector",
        { strokeDashoffset: 1, autoAlpha: 0 },
        {
          strokeDashoffset: 0,
          autoAlpha: 1,
          duration: 0.16,
          ease: "power2.out",
        },
        1.4,
      );
      tl.fromTo(
        ["#reverse-connector-dot", "#reverse-reticle", "#reverse-feature"],
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.16, ease: "power2.out" },
        1.4,
      );

      tl.fromTo(
        "#reverse-scanline",
        { x: 0, autoAlpha: 0 },
        { x: 258, autoAlpha: 0.55, duration: 0.19, ease: "power2.out" },
        1.44,
      );
      tl.to(
        "#reverse-scanline",
        { x: 304, autoAlpha: 0, duration: 0.19, ease: "power2.in" },
        1.63,
      );
      tl.fromTo(
        "#reverse-glow",
        { autoAlpha: 0.18 },
        {
          autoAlpha: 0.48,
          duration: 0.19,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        1.44,
      );

      tl.to(
        [
          "#reverse-label",
          "#reverse-connector",
          "#reverse-connector-dot",
          "#reverse-reticle",
          "#reverse-feature",
        ],
        { autoAlpha: 0, duration: 0.16, ease: "power2.in" },
        2.88,
      );

      tl.fromTo(
        "#front-label",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.16, ease: "power2.out", immediateRender: false },
        3.12,
      );
      tl.fromTo(
        "#front-connector",
        { strokeDashoffset: 1, autoAlpha: 0 },
        {
          strokeDashoffset: 0,
          autoAlpha: 1,
          duration: 0.16,
          ease: "power2.out",
          immediateRender: false,
        },
        3.12,
      );
      tl.fromTo(
        ["#front-connector-dot", "#front-reticle"],
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.16, ease: "power2.out", immediateRender: false },
        3.12,
      );
      tl.fromTo(
        "#front-glow",
        { autoAlpha: 0 },
        { autoAlpha: 0.18, duration: 0.16, ease: "power2.out", immediateRender: false },
        3.12,
      );

      window.__timelines["dual-blade-motion"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
