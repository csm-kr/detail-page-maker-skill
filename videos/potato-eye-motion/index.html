<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=800" />
    <title>감자 눈 제거 돌기 동작</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #0b2922;
        --accent: #dfff5a;
        --paper: #f4efe5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 800px;
        height: 800px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
      }

      #stage,
      .clip {
        position: relative;
        width: 800px;
        height: 800px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
        background: #eee5d8;
      }

      .action-frame {
        position: absolute;
        inset: 0;
        display: block;
        width: 800px;
        height: 800px;
        object-fit: cover;
        will-change: opacity;
      }

      #contact-frame {
        opacity: 0;
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(11, 41, 34, 0.08), transparent 25%),
          radial-gradient(circle at 53% 72%, transparent 0 20%, rgba(11, 41, 34, 0.11) 72%);
        pointer-events: none;
      }

      .contact-ui {
        position: absolute;
        inset: 0;
        width: 800px;
        height: 800px;
        overflow: visible;
        pointer-events: none;
      }

      #contact-ring,
      #contact-ring-echo {
        fill: none;
        stroke: var(--accent);
        stroke-width: 6;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }

      #contact-ring-echo {
        stroke: rgba(255, 255, 255, 0.88);
        stroke-width: 3;
      }

      #guide-path {
        fill: none;
        stroke: rgba(11, 41, 34, 0.9);
        stroke-linecap: round;
        stroke-width: 4;
      }

      #guide-dot {
        fill: var(--accent);
        stroke: var(--ink);
        stroke-width: 3;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="potato-eye-motion"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="800"
      data-height="800"
    >
      <section
        id="potato-eye-clip"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      >
        <img
          id="start-frame"
          class="action-frame"
          src="assets/potato-eye-start.png"
          alt="오른쪽 제거 돌기가 감자 눈 위에 떠 있는 시작 장면"
          data-layout-allow-overflow
        />
        <img
          id="contact-frame"
          class="action-frame"
          src="assets/potato-eye-contact.png"
          alt="오른쪽 제거 돌기가 감자 눈에 닿은 장면"
          data-layout-allow-overflow
        />
        <div class="shade" aria-hidden="true"></div>
        <svg class="contact-ui" viewBox="0 0 800 800" aria-hidden="true" data-layout-ignore>
          <path id="guide-path" pathLength="1" d="M 650 646 C 565 621 474 579 388 555" />
          <circle id="guide-dot" cx="382" cy="554" r="8" />
          <circle id="contact-ring-echo" cx="382" cy="554" r="54" />
          <circle id="contact-ring" cx="382" cy="554" r="43" />
        </svg>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const guidePath = document.querySelector("#guide-path");
      const guideLength = guidePath.getTotalLength();
      guidePath.style.strokeDasharray = String(guideLength);
      guidePath.style.strokeDashoffset = String(guideLength);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".shade", { opacity: 0.96 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
      tl.to("#start-frame", { opacity: 0, duration: 0.18, ease: "power1.inOut" }, 0.86);
      tl.to("#contact-frame", { opacity: 1, duration: 0.18, ease: "power1.inOut" }, 0.86);
      tl.fromTo(
        "#guide-path",
        { x: 8, strokeDashoffset: guideLength },
        { x: 0, strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        1.12,
      );
      tl.to("#guide-dot", { opacity: 1, duration: 0.08, ease: "none" }, 1.38);
      tl.fromTo(
        "#contact-ring",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        1.34,
      );
      tl.fromTo(
        "#contact-ring-echo",
        { opacity: 0 },
        { opacity: 0.72, duration: 0.42, ease: "power2.out" },
        1.48,
      );
      tl.to("#contact-ring-echo", { opacity: 0, duration: 0.46, ease: "power1.out" }, 2.0);
      tl.to("#contact-ring", { opacity: 0.58, duration: 0.34, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.12);
      tl.to(
        ["#guide-path", "#guide-dot", "#contact-ring"],
        { opacity: 0, duration: 0.24, ease: "power2.in" },
        3.14,
      );
      tl.set("#contact-frame", { opacity: 0 }, 3.4);
      tl.set("#start-frame", { opacity: 1 }, 3.4);

      window.__timelines["potato-eye-motion"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
