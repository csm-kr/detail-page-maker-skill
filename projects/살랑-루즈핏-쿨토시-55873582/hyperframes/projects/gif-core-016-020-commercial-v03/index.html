  <body>
    <main
      id="stage"

    <script>
      window.__timelines = window.__timelines || {};

      const values = window.__hyperframes.getVariables();
      const mode = values.mode || "compare";
      const activeScene = document.getElementById(mode);
      activeScene.classList.add("active");

      const tl = gsap.timeline({ paused: true, defaults: { overwrite: false } });
      const intro = (selector) => {
        tl.fromTo(
          `${selector} .kicker, ${selector} .headline, ${selector} .subline`,
          { x: -28, opacity: 0 },
          { x: 0, opacity: 1, duration: .5, stagger: .08, ease: "power3.out" },
          .06
        );
      };

      if (mode === "compare") {
        intro("#compare");
        tl.fromTo(".compare-frame", { y: 24, scale: .98 }, { y: 0, scale: 1, duration: .65, ease: "power3.out" }, .1);
        tl.set("#loose-photo", { clipPath: "inset(0 100% 0 0)" }, 0);
        tl.set(".divider", { x: 0 }, 0);
        tl.set(".divider-knob", { x: 0 }, 0);
        tl.to("#loose-photo", { clipPath: "inset(0 8% 0 0)", duration: 1.25, ease: "power2.inOut" }, 1.0);
        tl.to(".divider", { x: 429, duration: 1.25, ease: "power2.inOut" }, 1.0);
        tl.to(".divider-knob", { x: 429, duration: 1.25, ease: "power2.inOut" }, 1.0);
        tl.to(".chip.tight", { backgroundColor: "#e1e6ee", color: "#4b5668", scale: .94, duration: .3 }, 1.4);
        tl.to(".chip.loose", { backgroundColor: "#1460db", color: "#ffffff", scale: 1.07, duration: .4, ease: "back.out(1.5)" }, 1.78);
        tl.to(".compare-frame", { scale: 1.025, duration: 1.7, ease: "sine.inOut" }, 2.7);
      }

      if (mode === "cooling") {
        intro("#cooling");
        tl.fromTo("#cooling .media", { scale: 1.04 }, { scale: 1, duration: .72, ease: "power3.out" }, 0);
        tl.fromTo(".thermal-layer", { x: 0, opacity: 1 }, { x: -300, opacity: .12, duration: 1.65, ease: "power2.inOut" }, .72);
        tl.fromTo(".cool-sweep", { x: -760, opacity: .1 }, { x: 90, opacity: 1, duration: 1.55, ease: "power2.inOut" }, .78);
        tl.fromTo(".air-stream", { y: 32, scaleX: .12, opacity: 0 }, { y: -18, scaleX: 1, opacity: .92, duration: .72, stagger: .13, ease: "power3.out" }, 1.42);
        tl.fromTo(".frost-particle", { y: 32, scale: .25, opacity: 0 }, { y: -34, scale: 1, opacity: .92, duration: .82, stagger: .12, ease: "power2.out" }, 1.7);
        tl.to("#cooling .chip.warm", { x: -16, opacity: 0, scale: .94, duration: .35 }, 1.88);
