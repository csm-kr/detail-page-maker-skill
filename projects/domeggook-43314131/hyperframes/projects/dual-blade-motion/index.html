<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=720" />
    <title>양면 커터 뒤집기 모션</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        src: local("Noto Sans KR");
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Apple SD Gothic Neo";
        src: local("Apple SD Gothic Neo");
        font-style: normal;
        font-weight: 100 900;
      }

      :root {
        --ink: #0b2922;
        --surface: #173e34;
        --accent: #dfff5a;
        --paper: #f4f1e8;
        --white: #fffef9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 800px;
        height: 720px;
        margin: 0;
        overflow: hidden;
        background: var(--ink);
      }

      body {
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      }

      #stage {
        position: relative;
        width: 800px;
        height: 720px;
        overflow: hidden;
        color: var(--white);
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .scene-fill {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 40%, rgba(223, 255, 90, 0.17), transparent 38%),
          linear-gradient(145deg, #173e34 0%, #0b2922 68%, #061612 100%);
      }

      .scene-fill::before {
        position: absolute;
        inset: 24px;
        border: 1px solid rgba(223, 255, 90, 0.16);
        border-radius: 34px;
        content: "";
      }

      .kicker {
        position: absolute;
        top: 43px;
        left: 0;
        width: 100%;
        color: rgba(255, 254, 249, 0.72);
        font-size: 13px;
        font-weight: 850;
        letter-spacing: 0.18em;
        text-align: center;
      }

      .flip-stage {
        position: absolute;
        top: 88px;
        left: 115px;
        width: 570px;
        height: 520px;
        perspective: 1500px;
      }

      #flip-card {
        position: relative;
        display: block;
        width: 570px;
        height: 520px;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: grid;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.36);
        border-radius: 36px;
        background: var(--paper);
        box-shadow: 0 34px 64px rgba(0, 0, 0, 0.34);
        backface-visibility: hidden;
        transform-style: preserve-3d;
      }

      .card-face--back {
        transform: rotateY(180deg);
      }

      .card-face img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-face--back img {
        transform: scaleY(-1);
      }

      .status-label {
        position: absolute;
        right: 24px;
        bottom: 24px;
        left: 24px;
        z-index: 5;
        display: flex;
        min-height: 74px;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        border-radius: 20px;
        color: var(--white);
        background: rgba(11, 41, 34, 0.94);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.22);
      }

      .status-label strong {
        font-size: 27px;
        font-weight: 900;
        letter-spacing: -0.055em;
      }

      .status-label span {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 50%;
        color: var(--ink);
        background: var(--accent);
        font-size: 13px;
        font-weight: 950;
      }

      .status-label--back {
        opacity: 0;
        visibility: hidden;
      }

      .turn-guide {
        position: absolute;
        inset: 0;
        width: 800px;
        height: 720px;
        overflow: visible;
        pointer-events: none;
      }

      .turn-guide path {
        fill: none;
        stroke: var(--accent);
        stroke-linecap: round;
        stroke-width: 3;
      }

      .turn-guide polygon {
        fill: var(--accent);
      }

      .turn-copy {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        color: rgba(255, 254, 249, 0.78);
        font-size: 16px;
        font-weight: 760;
        letter-spacing: -0.025em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="dual-blade-motion"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="800"
      data-height="720"
    >
      <section
        id="dual-blade-clip"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      >
        <div class="scene-fill" aria-hidden="true"></div>
        <p class="kicker" data-layout-allow-occlusion>FLIP THE HEAD · CHOOSE THE CUT</p>

        <div class="flip-stage">
          <div id="flip-card">
            <article class="card-face card-face--front" data-layout-allow-overflow>
              <img
                src="assets/blade-face-a.png"
                alt="껍질 제거와 얇게 썰기에 사용하는 커터 면"
              />
            </article>
            <article class="card-face card-face--back" data-layout-allow-overflow>
              <img src="assets/blade-face-b.png" alt="채썰기에 사용하는 반대쪽 커터 면" />
            </article>
          </div>
          <div id="status-a" class="status-label">
            <strong>껍질 제거 · 얇게 썰기</strong>
            <span>A</span>
          </div>
          <div id="status-b" class="status-label status-label--back">
            <strong>채썰기 커터</strong>
            <span>B</span>
          </div>
        </div>

        <svg class="turn-guide" viewBox="0 0 800 720" aria-hidden="true" data-layout-ignore>
          <path id="turn-path" pathLength="1" d="M 182 612 C 278 642, 522 642, 618 612" />
          <polygon id="turn-arrow" points="615,602 638,610 620,626" />
        </svg>
        <p class="turn-copy">헤드를 뒤집으면 반대쪽 커터가 이어집니다</p>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const turnPath = document.querySelector("#turn-path");
      const turnPathLength = turnPath.getTotalLength();
      turnPath.style.strokeDasharray = String(turnPathLength);
      turnPath.style.strokeDashoffset = String(turnPathLength);

      tl.set("#flip-card", { rotationY: 0, z: 0 });
      tl.set("#turn-path", { strokeDashoffset: turnPathLength, opacity: 0.32 });
      tl.set("#turn-arrow", { opacity: 0.32, scale: 0.8, transformOrigin: "50% 50%" });
      tl.set("#status-a", { autoAlpha: 1 });
      tl.set("#status-b", { autoAlpha: 0 });

      tl.to(
        "#turn-path",
        { strokeDashoffset: 0, opacity: 0.92, duration: 0.42, ease: "power2.out" },
        0.35,
      );
      tl.to(
        "#turn-arrow",
        { opacity: 0.92, scale: 1, duration: 0.2, ease: "back.out(1.5)" },
        0.62,
      );

      tl.to(
        "#flip-card",
        {
          keyframes: [
            { rotationY: 0, z: 0, duration: 0.01 },
            { rotationY: 92, z: 58, duration: 0.34, ease: "power2.in" },
            { rotationY: 180, z: 0, duration: 0.34, ease: "power2.out" },
          ],
          ease: "none",
        },
        0.78,
      );
      tl.to("#status-a", { autoAlpha: 0, duration: 0.14, ease: "power2.in" }, 0.96);
      tl.to("#status-b", { autoAlpha: 1, duration: 0.18, ease: "power2.out" }, 1.24);

      tl.to(
        "#flip-card",
        {
          keyframes: [
            { rotationY: 180, z: 0, duration: 0.01 },
            { rotationY: 268, z: 58, duration: 0.34, ease: "power2.in" },
            { rotationY: 360, z: 0, duration: 0.34, ease: "power2.out" },
          ],
          ease: "none",
        },
        2.72,
      );
      tl.to("#status-b", { autoAlpha: 0, duration: 0.14, ease: "power2.in" }, 2.9);
      tl.to("#status-a", { autoAlpha: 1, duration: 0.18, ease: "power2.out" }, 3.18);

      tl.to(
        ["#turn-path", "#turn-arrow"],
        { opacity: 0.32, duration: 0.25, ease: "sine.inOut" },
        3.45,
      );

      window.__timelines["dual-blade-motion"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
