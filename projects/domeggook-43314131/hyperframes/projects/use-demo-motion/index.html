<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=600" />
    <title>오이 슬라이스 사용 모션</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 800px;
        height: 600px;
        margin: 0;
        overflow: hidden;
        background: #e8eee8;
      }

      #stage,
      .clip,
      .frame {
        position: absolute;
        inset: 0;
        width: 800px;
        height: 600px;
        overflow: hidden;
      }

      .frame {
        display: block;
        object-fit: cover;
      }

      #end-frame-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        clip-path: inset(0 100% 0 0);
        will-change: clip-path;
      }

      #sweep {
        position: absolute;
        top: 0;
        left: -24px;
        width: 24px;
        height: 600px;
        background: linear-gradient(
          90deg,
          rgba(223, 255, 90, 0),
          rgba(223, 255, 90, 0.88),
          rgba(255, 255, 255, 0)
        );
        filter: blur(5px);
        opacity: 0;
        will-change: transform;
      }

      .safe-frame {
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(11, 41, 34, 0.12);
        border-radius: 24px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="use-demo-motion"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="800"
      data-height="600"
    >
      <section
        id="use-demo-clip"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      >
        <img
          id="start-frame"
          class="frame"
          src="assets/use-start.png"
          alt="스테인리스 이중 칼날 커터를 오이에 대기 전"
        />
        <div id="end-frame-wrap">
          <img
            id="end-frame"
            class="frame"
            src="assets/use-end.png"
            alt="스테인리스 이중 칼날 커터로 얇은 오이 슬라이스를 만든 후"
          />
        </div>
        <span id="sweep" aria-hidden="true"></span>
        <span class="safe-frame" aria-hidden="true"></span>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      tl.set("#end-frame-wrap", { clipPath: "inset(0 100% 0 0)" }, 0);
      tl.set("#sweep", { x: 0, autoAlpha: 0 }, 0);
      tl.to(
        "#end-frame-wrap",
        {
          clipPath: "inset(0 0% 0 0)",
          duration: 1.05,
          ease: "power2.inOut",
        },
        0.55,
      );
      tl.fromTo(
        "#sweep",
        { x: 0, autoAlpha: 0 },
        {
          x: 824,
          autoAlpha: 0.72,
          duration: 1.05,
          ease: "power2.inOut",
        },
        0.55,
      );
      tl.to("#sweep", { autoAlpha: 0, duration: 0.12, ease: "none" }, 1.6);
      tl.to(
        "#end-frame-wrap",
        {
          clipPath: "inset(0 100% 0 0)",
          duration: 0.7,
          ease: "power2.inOut",
        },
        3.0,
      );
      tl.fromTo(
        "#sweep",
        { x: 824, autoAlpha: 0 },
        {
          x: 0,
          autoAlpha: 0.58,
          duration: 0.7,
          ease: "power2.inOut",
        },
        3.0,
      );
      tl.to("#sweep", { autoAlpha: 0, duration: 0.1, ease: "none" }, 3.7);

      window.__timelines["use-demo-motion"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
