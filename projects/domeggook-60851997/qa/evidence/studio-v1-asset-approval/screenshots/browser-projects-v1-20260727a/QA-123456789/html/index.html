<!doctype html>
<html lang="ko" data-studio-project="QA-123456789">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA 상세페이지 작업본</title>
    <style>
      :root {
        --ink: #152034;
        --muted: #66758d;
        --line: #dce4ef;
        --surface: #f4f7fb;
        --accent: #176bff;
      }
      * { box-sizing: border-box; }
      html { background: #dfe7f2; }
      body { width: min(100%, 800px); margin: 0 auto; background: #fff; color: var(--ink); font-family: "Pretendard", "Malgun Gothic", sans-serif; }
      section { min-height: 640px; padding: 84px 64px; border-bottom: 1px solid var(--line); }
      .hero { display: grid; align-content: start; min-height: 900px; background: linear-gradient(150deg, #eef4ff, #fff 58%); }
      .eyebrow { margin: 0 0 18px; color: var(--accent); font-size: 16px; font-weight: 800; }
      h1, h2, p { margin-top: 0; }
      h1 { max-width: 680px; margin-bottom: 24px; font-size: clamp(48px, 8vw, 76px); line-height: 1.06; letter-spacing: -.055em; }
      h2 { max-width: 620px; margin-bottom: 20px; font-size: clamp(36px, 6vw, 58px); line-height: 1.12; letter-spacing: -.045em; }
      p { max-width: 560px; color: var(--muted); font-size: 22px; font-weight: 600; line-height: 1.65; }
      .placeholder { display: grid; place-items: center; min-height: 360px; margin-top: 44px; border: 1px dashed #a9b8cc; border-radius: 20px; background: var(--surface); color: #71839c; font-weight: 800; }
      [data-studio-selected="true"] { outline: 3px solid var(--accent); outline-offset: 4px; }
      @media (max-width: 520px) {
        section { min-height: 520px; padding: 60px 28px; }
        .hero { min-height: 720px; }
        p { font-size: 18px; }
      }
    </style>
  </head>
  <body data-export-name="QA-123456789-standalone.html">
    <main id="detailPage">
      <section class="hero" data-section="hero">
        <p class="eyebrow" data-layer-id="hero-brand" data-edit>QA</p>
        <h1 data-layer-id="hero-title" data-edit>승인된 에셋으로 첫 화면을 조립합니다.</h1>
        <p data-layer-id="hero-body" data-edit>제품 사실과 사용자 승인이 준비되면 이 작업 화면이 상업 상세페이지로 바뀝니다.</p>
      </section>
      <section data-section="asset-proof">
        <h2 data-layer-id="proof-title" data-edit>제품을 보여 줄 에셋을 먼저 완성해 주세요.</h2>
        <p data-layer-id="proof-body" data-edit>이미지와 GIF를 개별 검수한 뒤 승인된 버전만 여기에 배치할 수 있습니다.</p>
        <div class="placeholder" data-layer-id="proof-media">승인 에셋 자리</div>
      </section>
      <section data-section="source">
        <h2 data-layer-id="source-title" data-edit>공급처 기준</h2>
        <p data-layer-id="source-url" data-edit>https://domeggook.com/123456789</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
