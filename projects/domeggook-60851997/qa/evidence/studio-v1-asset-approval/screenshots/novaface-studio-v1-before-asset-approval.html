<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>노바페이스 상세페이지 스튜디오</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #0d1626;
        --panel-2: #142239;
        --line: #2a3e5d;
        --text: #eef5ff;
        --muted: #91a8c5;
        --blue: #176bff;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07101d; color: var(--text); font-family: "Malgun Gothic", sans-serif; }
      button, input, select { font: inherit; }
      .app { display: grid; grid-template-columns: 330px 1fr; width: 100%; height: 100%; }
      aside { position: relative; z-index: 3; overflow: auto; padding: 22px; border-right: 1px solid var(--line); background: var(--panel); box-shadow: 20px 0 55px rgba(0,0,0,.28); }
      .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 21px; }
      .brand-mark { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 15px; background: linear-gradient(145deg, var(--blue), #58a9ff); color: #fff; font-weight: 950; }
      .brand strong { display: block; font-size: 15px; }
      .brand span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .group { padding: 18px 0; border-top: 1px solid var(--line); }
      .group h2 { margin: 0 0 12px; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
      .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      button, .link-button { min-height: 40px; padding: 0 11px; border: 1px solid #39516f; border-radius: 11px; background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 850; }
      button:hover, .link-button:hover { border-color: #75a0d1; background: #1b2d49; }
      button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
      button.wide, .link-button.wide { display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 8px; text-decoration: none; }
      label { display: block; margin: 10px 0 6px; color: #aec0d8; font-size: 11px; font-weight: 800; }
      input[type="text"], input[type="number"], select { width: 100%; height: 40px; padding: 0 10px; border: 1px solid #39516f; border-radius: 10px; outline: none; background: #08111e; color: var(--text); font-size: 11px; }
      input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--blue); }
      input[type="color"] { width: 100%; height: 42px; padding: 4px; border: 1px solid #39516f; border-radius: 10px; background: #08111e; }
      input[type="file"] { width: 100%; color: var(--muted); font-size: 10px; }
      .hint { margin: 9px 0 0; color: #8198b5; font-size: 10px; line-height: 1.55; }
      .status { position: sticky; bottom: 0; margin-top: 18px; padding: 12px; border: 1px solid #344b69; border-radius: 12px; background: #101d30; color: #abc0da; font-size: 10px; line-height: 1.5; }
      .workspace { position: relative; overflow: auto; background: radial-gradient(circle at 50% 0%, #263c5e, #07101b 68%); }
      .canvas-toolbar { position: sticky; z-index: 3; top: 15px; display: flex; justify-content: center; gap: 7px; width: fit-content; margin: 15px auto 0; padding: 7px; border: 1px solid #354f70; border-radius: 14px; background: rgba(8,16,29,.92); backdrop-filter: blur(10px); }
      .canvas-toolbar button { min-height: 33px; }
      .canvas-shell { width: fit-content; min-height: 100%; margin: 0 auto; padding: 24px 42px 46px; }
      iframe { display: block; width: 360px; min-height: 1200px; border: 0; background: #f7fafd; box-shadow: 0 34px 100px rgba(0,0,0,.55); transition: width .2s ease; }
      .selected { color: #78b6ff; }
      .section-row { display: grid; grid-template-columns: 1fr 44px; gap: 8px; }
      .section-row button { min-height: 40px; }
      .section-actions { margin-top: 8px; }
      .height-auto { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; padding: 10px 11px; border: 1px solid #334b6a; border-radius: 10px; background: #0a1423; color: var(--text); cursor: pointer; }
      .height-auto input { accent-color: var(--blue); }
      .height-input { display: grid; grid-template-columns: 1fr 28px; align-items: center; gap: 7px; }
      .height-input span { color: var(--muted); font-size: 10px; }
      .height-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
      .height-buttons button { padding-inline: 5px; }
      .height-measure { margin: 9px 0 0; color: #78b6ff; font-size: 10px; line-height: 1.45; }
      @media (max-width: 1050px) { .app { grid-template-columns: 280px 1fr; } aside { padding: 17px; } .canvas-shell { margin-left: 0; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <div class="brand-mark">NF</div>
          <div>
            <strong>노바페이스 상세페이지</strong>
            <span>수정 가능한 커머셜 HTML</span>
          </div>
        </div>

        <section class="group">
          <h2>편집</h2>
          <div class="button-grid">
            <button id="toggleEdit" type="button" class="primary">수정 모드 켜기</button>
            <button id="save" type="button">로컬 저장</button>
            <button id="reset" type="button">초기화</button>
            <button id="replay" type="button">GIF 다시 재생</button>
          </div>
          <p class="hint">수정 모드에서 문구를 직접 클릭하거나 이미지를 선택해 교체할 수 있습니다.</p>
        </section>

        <section class="group">
          <h2>섹션 순서</h2>
          <div class="section-row">
            <select id="sectionSelect" aria-label="순서를 바꿀 섹션"></select>
            <button id="toggleSection" type="button" title="섹션 표시 전환">보기</button>
          </div>
          <div class="button-grid section-actions">
            <button id="moveUp" type="button">위로</button>
            <button id="moveDown" type="button">아래로</button>
          </div>
        </section>

        <section class="group">
          <h2>선택한 이미지</h2>
          <div id="selectedLabel" class="hint">수정 모드에서 이미지를 선택해 주세요.</div>
          <label for="imageSrc">이미지 경로</label>
          <input id="imageSrc" type="text" placeholder="../assets/..." />
          <label for="imageAlt">대체 텍스트</label>
          <input id="imageAlt" type="text" placeholder="이미지 설명" />
          <label for="imageFile">로컬 이미지 불러오기</label>
          <input id="imageFile" type="file" accept="image/*" />
          <button id="applyImage" type="button" class="wide">선택 이미지에 적용</button>
        </section>

        <section class="group">
          <h2>테마</h2>
          <label for="accent">강조색</label>
          <input id="accent" type="color" value="#176bff" />
        </section>

        <section class="group">
          <h2>캔버스 높이</h2>
          <label class="height-auto" for="autoHeight">
            <input id="autoHeight" type="checkbox" checked />
            내용에 자동으로 딱 맞춤
          </label>
          <div class="height-input">
            <input id="pageHeight" type="number" min="360" max="100000" step="20" value="1200" aria-label="미리보기 높이" />
            <span>px</span>
          </div>
          <div class="height-buttons">
            <button id="heightMinus" type="button">−100</button>
            <button id="heightFit" type="button" class="primary">딱 맞춤</button>
            <button id="heightPlus" type="button">+100</button>
          </div>
          <p id="heightMeasure" class="height-measure">실제 내용 높이를 계산하는 중입니다.</p>
        </section>

        <section class="group">
          <h2>내보내기</h2>
          <button id="exportHtml" type="button" class="wide primary">에셋 포함 단일 HTML 다운로드</button>
            <a class="link-button wide" href="index.html?v=23" target="_blank" rel="noreferrer">상세페이지만 새 창으로</a>
            <p class="hint">CSS·이미지·GIF를 HTML 안에 포함합니다. 기본 파일명은 novaface-detail-page-v21-standalone.html이며 바탕화면으로 옮겨도 단독으로 열립니다.</p>
        </section>

        <div id="status" class="status">미리보기를 불러오는 중입니다.</div>
      </aside>

      <main class="workspace">
        <div class="canvas-toolbar" role="group" aria-label="미리보기 너비">
          <button type="button" data-width="800">800</button>
          <button type="button" data-width="430">430</button>
          <button type="button" data-width="360" class="primary">360</button>
        </div>
        <div class="canvas-shell">
          <iframe id="preview" src="index.html?v=23" title="노바페이스 기능성깔창 상세페이지 미리보기"></iframe>
        </div>
      </main>
    </div>

    <script>
      const preview = document.querySelector("#preview");
      const toggleEdit = document.querySelector("#toggleEdit");
      const status = document.querySelector("#status");
      const srcInput = document.querySelector("#imageSrc");
      const altInput = document.querySelector("#imageAlt");
      const selectedLabel = document.querySelector("#selectedLabel");
      const sectionSelect = document.querySelector("#sectionSelect");
      const autoHeight = document.querySelector("#autoHeight");
      const pageHeight = document.querySelector("#pageHeight");
      const heightMeasure = document.querySelector("#heightMeasure");
      let editing = false;
      let selectedImageIndex = -1;
      let sections = [];
      let measuredHeight = 1200;

      function post(type, payload = {}) {
        preview.contentWindow.postMessage({ type, ...payload }, "*");
      }
      function setStatus(message) {
        status.textContent = message;
      }
      function applyPreviewHeight(value, manual = false) {
        const next = Math.max(360, Math.min(100000, Math.round(Number(value) || measuredHeight)));
        preview.style.height = `${next}px`;
        pageHeight.value = String(next);
        if (manual) autoHeight.checked = false;
        return next;
      }
      function fitPreviewHeight() {
        autoHeight.checked = true;
        applyPreviewHeight(measuredHeight);
        post("DETAIL_REQUEST_HEIGHT");
        setStatus(`내용 높이 ${measuredHeight.toLocaleString("ko-KR")}px에 자동으로 맞췄습니다.`);
      }
      function refreshSectionSelect(nextId) {
        const current = nextId || sectionSelect.value;
        sectionSelect.innerHTML = sections
          .map((section) => `<option value="${section.id}">${section.index + 1}. ${section.hidden ? "숨김 · " : ""}${section.label}</option>`)
          .join("");
        if (sections.some((section) => section.id === current)) sectionSelect.value = current;
      }

      toggleEdit.addEventListener("click", () => {
        editing = !editing;
        toggleEdit.textContent = editing ? "수정 모드 끄기" : "수정 모드 켜기";
        toggleEdit.classList.toggle("primary", !editing);
        post("DETAIL_SET_EDITING", { enabled: editing });
        setStatus(editing ? "문구를 클릭하거나 이미지를 선택해 주세요." : "미리보기 모드입니다.");
      });
      document.querySelector("#save").addEventListener("click", () => post("DETAIL_SAVE"));
      document.querySelector("#replay").addEventListener("click", () => post("DETAIL_REPLAY_GIFS"));
      document.querySelector("#reset").addEventListener("click", () => {
        if (confirm("로컬에 저장한 수정 내용을 모두 초기화할까요?")) post("DETAIL_RESET");
      });
      document.querySelector("#moveUp").addEventListener("click", () => post("DETAIL_MOVE_SECTION", { id: sectionSelect.value, direction: "up" }));
      document.querySelector("#moveDown").addEventListener("click", () => post("DETAIL_MOVE_SECTION", { id: sectionSelect.value, direction: "down" }));
      document.querySelector("#toggleSection").addEventListener("click", () => {
        const section = sections.find((item) => item.id === sectionSelect.value);
        if (section) post("DETAIL_TOGGLE_SECTION", { id: section.id, hidden: !section.hidden });
      });
      document.querySelector("#accent").addEventListener("input", (event) => post("DETAIL_SET_ACCENT", { value: event.target.value }));
      autoHeight.addEventListener("change", () => {
        if (autoHeight.checked) fitPreviewHeight();
        else setStatus("수동 높이 조절 모드입니다.");
      });
      pageHeight.addEventListener("input", () => {
        const next = applyPreviewHeight(pageHeight.value, true);
        setStatus(`미리보기 높이를 ${next.toLocaleString("ko-KR")}px로 조절했습니다.`);
      });
      document.querySelector("#heightMinus").addEventListener("click", () => {
        const next = applyPreviewHeight(preview.getBoundingClientRect().height - 100, true);
        setStatus(`미리보기 높이를 ${next.toLocaleString("ko-KR")}px로 줄였습니다.`);
      });
      document.querySelector("#heightPlus").addEventListener("click", () => {
        const next = applyPreviewHeight(preview.getBoundingClientRect().height + 100, true);
        setStatus(`미리보기 높이를 ${next.toLocaleString("ko-KR")}px로 늘렸습니다.`);
      });
      document.querySelector("#heightFit").addEventListener("click", fitPreviewHeight);
      document.querySelector("#imageFile").addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { srcInput.value = reader.result; };
        reader.readAsDataURL(file);
      });
      document.querySelector("#applyImage").addEventListener("click", () => {
        if (selectedImageIndex < 0) {
          setStatus("먼저 수정 모드에서 이미지를 선택해 주세요.");
          return;
        }
        post("DETAIL_SET_IMAGE", { index: selectedImageIndex, src: srcInput.value.trim(), alt: altInput.value.trim() });
        setStatus(`이미지 ${selectedImageIndex + 1}번을 미리보기에 적용했습니다.`);
      });
      document.querySelectorAll("[data-width]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-width]").forEach((item) => item.classList.toggle("primary", item === button));
          preview.style.width = `${button.dataset.width}px`;
          setStatus(`${button.dataset.width}px 너비와 페이지 높이를 다시 계산하는 중입니다.`);
          requestAnimationFrame(() => post("DETAIL_REQUEST_HEIGHT"));
        });
      });
      document.querySelector("#exportHtml").addEventListener("click", () => {
        post("DETAIL_EXPORT_HTML");
        setStatus("CSS와 에셋을 포함한 단일 HTML을 준비하는 중입니다.");
      });
      window.addEventListener("message", (event) => {
        const message = event.data || {};
        if (message.type === "DETAIL_READY") {
          if (Number(message.height) > 0) {
            measuredHeight = Math.ceil(Number(message.height));
            heightMeasure.textContent = `실제 내용 높이 ${measuredHeight.toLocaleString("ko-KR")}px`;
            if (autoHeight.checked) applyPreviewHeight(measuredHeight);
          }
          sections = message.sections || [];
          refreshSectionSelect();
          setStatus(`${message.sectionCount}개 섹션 · 수정 문구 ${message.editableCount}개 · 이미지 ${message.imageCount}개 준비됨`);
        }
        if (message.type === "DETAIL_SAVED") setStatus(`로컬 저장 완료 · ${new Date(message.savedAt).toLocaleTimeString("ko-KR")}`);
        if (message.type === "DETAIL_EXPORT_PROGRESS") {
          setStatus(`단일 HTML 에셋 포함 중 · ${message.completed}/${message.total}`);
        }
        if (message.type === "DETAIL_EXPORTED") {
          setStatus(`${message.filename} 파일을 브라우저의 다운로드 폴더에 저장했습니다.`);
        }
        if (message.type === "DETAIL_EXPORT_ERROR") {
          setStatus(`다운로드 실패 · ${message.message || "브라우저에서 다운로드를 허용한 뒤 다시 시도해 주세요."}`);
        }
        if (message.type === "DETAIL_IMAGE_SELECTED") {
          selectedImageIndex = message.index;
          srcInput.value = message.src;
          altInput.value = message.alt;
          selectedLabel.innerHTML = `<span class="selected">${message.assetId || `이미지 #${message.index + 1}`}</span> 선택됨`;
        }
      });
    </script>
  </body>
</html>
