<!doctype html>
<html lang="ko" data-studio-project="{{PROJECT_KEY}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=780" />
    <title>{{PRODUCT_NAME}} 상세페이지</title>
    <style>
      :root {
        --ink: #142033;
        --muted: #627086;
        --surface: #f2f6fb;
        --accent: #176bff;
      }
      * { box-sizing: border-box; }
      html { background: #e4eaf2; }
      body {
        width: 780px;
        margin: 0 auto;
        background: #fff;
        color: var(--ink);
        font-family: "Pretendard", "Malgun Gothic", sans-serif;
      }
      section { padding: 88px 72px; }
      section:nth-child(even) { background: var(--surface); }
      .hero { min-height: 860px; padding-top: 112px; }
      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 20px;
        font-weight: 800;
      }
      h1, h2, p { margin-top: 0; }
      h1 {
        margin-bottom: 24px;
        font-size: 68px;
        line-height: 1.08;
        letter-spacing: -0.05em;
      }
      h2 {
        margin-bottom: 20px;
        font-size: 48px;
        line-height: 1.16;
        letter-spacing: -0.04em;
      }
      p {
        color: var(--muted);
        font-size: 24px;
        font-weight: 600;
        line-height: 1.65;
      }
      .media-slot {
        display: grid;
        min-height: 520px;
        margin-top: 44px;
        place-items: center;
        border-radius: 28px;
        background: #dfe7f2;
        color: #718099;
        font-size: 22px;
        font-weight: 800;
      }
    </style>
  </head>
  <body data-export-name="{{EXPORT_FILENAME}}">
    <main id="detailPage">
      <section class="hero" data-section="hero">
        <p class="eyebrow" data-edit>{{PRODUCT_NAME}}</p>
        <h1 data-edit>가장 중요한 변화가<br />첫 화면에 남도록</h1>
        <p data-edit>지정한 쿠팡 페이지의 판매 흐름을 현재 상품의 사실과 장면으로 다시 설계합니다.</p>
        <div class="media-slot" data-edit-object>780px Hero media</div>
      </section>
      <section data-section="next-message">
        <h2 data-edit>한 패널에는<br />하나의 메시지만</h2>
        <p data-edit>완성된 FLOW-PLAN의 다음 섹션이 여기에 조립됩니다.</p>
        <div class="media-slot" data-edit-object>780px image or GIF</div>
      </section>
    </main>
  </body>
</html>
